<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - PUNGUZA SAUTI</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #ffffff; color: #0f172a; padding: 16px; }
    .container { max-width: 540px; margin: 0 auto; }
    .header { text-align: center; padding: 18px 0; border-bottom: 1px solid #e2e8f0; margin-bottom: 20px; }
    .header h1 { margin: 0; font-size: 22px; color: #0284c7; font-weight: 800; }
    .card { background: #ffffff; border-radius: 16px; padding: 20px; margin-bottom: 16px; border: 1px solid #e2e8f0; box-shadow: 0 4px 16px rgba(15, 23, 42, 0.05); }
    .card h2 { margin: 0 0 12px; font-size: 16px; color: #0f172a; font-weight: 700; }
    label { display: block; font-size: 13px; color: #334155; font-weight: 600; margin-bottom: 6px; }
    input, textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1.5px solid #cbd5e1; background: #f8fafc; color: #0f172a; font-size: 14px; margin-bottom: 12px; }
    input:focus, textarea:focus { outline: none; border-color: #0284c7; background: #ffffff; }
    button { width: 100%; padding: 13px; border: none; border-radius: 12px; background: linear-gradient(135deg, #0284c7, #2563eb); color: #ffffff; font-weight: 700; font-size: 14px; cursor: pointer; }
    .btn-green { background: linear-gradient(135deg, #16a34a, #059669); margin-top: 8px; }
    .item-box { background: #f8fafc; padding: 14px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #cbd5e1; font-size: 13px; color: #0f172a; line-height: 1.6; }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>ADMIN PANEL • PUNGUZA SAUTI</h1>
  </div>

  <!-- PIN YA ADMIN -->
  <div id="pinCard" class="card">
    <h2>Ingiza PIN ya Msimamizi</h2>
    <input type="password" id="adminPin" placeholder="Weka PIN (PIN ya awali: 2026)">
    <button onclick="checkPin()">Fungua Jopo la Admin</button>
  </div>

  <!-- JOPO KUU LA ADMIN -->
  <div id="adminPanel" class="hidden">
    <!-- MIPANGILIO YA NAMBA ZA MALIPO NA MAKATO -->
    <div class="card" style="border-top: 4px solid #0284c7;">
      <h2>1. Mipangilio ya Malipo & Asilimia</h2>
      <label>Namba Zako za Kupokea Malipo (Zitaonekana kwa wateja)</label>
      <textarea id="payDetailsInput" rows="4" placeholder="Mfano:&#10;M-Pesa Lipa Namba: 5566778 (Jina: BONGO LINK)&#10;Tigo Pesa: 0712 000 000"></textarea>
      <label>Asilimia Yako ya Makato (%)</label>
      <input type="number" id="feePercentInput" placeholder="Mfano: 10">
      <button onclick="saveSettings()">Hifadhi Mipangilio</button>
    </div>

    <!-- HAKIKI MALIPO YALIYOINGIA -->
    <div class="card" style="border-top: 4px solid #f59e0b;">
      <h2>2. Malipo Yanayosubiri Uhakiki (Pending)</h2>
      <div id="pendingPaymentsList">Inapakia...</div>
    </div>

    <!-- MAOMBI YA WITHDRAW YA CREATORS -->
    <div class="card" style="border-top: 4px solid #16a34a;">
      <h2>3. Maombi ya Kutoa Pesa (Withdrawals)</h2>
      <div id="pendingWithdrawsList">Inapakia...</div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDGO1CbF7SamuFLH2JLczAlOw3uoEwURlg",
    authDomain: "bongo-pesalink.firebaseapp.com",
    projectId: "bongo-pesalink",
    storageBucket: "bongo-pesalink.firebasestorage.app",
    messagingSenderId: "987154176441",
    appId: "1:987154176441:web:b13e754ece8996ca737e68"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const SECRET_PIN = "2026";

  window.checkPin = async () => {
    const pin = document.getElementById("adminPin").value.trim();
    if (pin !== SECRET_PIN) return alert("PIN si sahihi!");
    document.getElementById("pinCard").classList.add("hidden");
    document.getElementById("adminPanel").classList.remove("hidden");
    loadAdminData();
  };

  async function loadAdminData() {
    const setSnap = await getDoc(doc(db, "settings", "config"));
    if (setSnap.exists()) {
      document.getElementById("payDetailsInput").value = setSnap.data().paymentDetails || "";
      document.getElementById("feePercentInput").value = setSnap.data().feePercent ?? 10;
    }

    const qPay = query(collection(db, "payments"), where("status", "==", "pending"));
    onSnapshot(qPay, (snap) => {
      const div = document.getElementById("pendingPaymentsList");
      div.innerHTML = "";
      if (snap.empty) {
        div.innerHTML = "<p style='font-size:13px; color:#64748b;'>Hakuna malipo mapya yanayosubiri.</p>";
        return;
      }
      snap.forEach((d) => {
        const p = d.data();
        div.innerHTML += `
          <div class="item-box">
            <b>Maelezo:</b> ${p.videoTitle}<br>
            <b>Kiasi:</b> <span style="color:#0284c7; font-weight:bold;">TSh ${Number(p.amount).toLocaleString()}</span><br>
            <b>Namba ya Mteja:</b> ${p.buyerPhone}<br>
            <b>Muamala (TxID):</b> <span style="background:#fef3c7; color:#b45309; padding:2px 6px; border-radius:4px; font-weight:bold;">${p.txId}</span><br>
            <b>Creator:</b> ${p.creatorPhone}
            <button class="btn-green" onclick="verifyPayment('${d.id}')">✔ Thibitisha Muamala Umeingia</button>
          </div>
        `;
      });
    });

    const qWith = query(collection(db, "withdrawals"), where("status", "==", "pending"));
    onSnapshot(qWith, (snap) => {
      const div = document.getElementById("pendingWithdrawsList");
      div.innerHTML = "";
      if (snap.empty) {
        div.innerHTML = "<p style='font-size:13px; color:#64748b;'>Hakuna maombi ya withdraw kwa sasa.</p>";
        return;
      }
      snap.forEach((d) => {
        const w = d.data();
        div.innerHTML += `
          <div class="item-box">
            <b>Creator:</b> ${w.creatorName} (${w.creatorPhone})<br>
            <b>Kiasi Anachotoa:</b> <span style="color:#16a34a; font-weight:bold;">TSh ${Number(w.amount).toLocaleString()}</span><br>
            <button class="btn-green" onclick="markWithdrawPaid('${d.id}')">✔ Nimeshamtumia Pesa (Mark Paid)</button>
          </div>
        `;
      });
    });
  }

  window.saveSettings = async () => {
    const paymentDetails = document.getElementById("payDetailsInput").value.trim();
    const feePercent = Number(document.getElementById("feePercentInput").value);
    await setDoc(doc(db, "settings", "config"), { paymentDetails, feePercent }, { merge: true });
    alert("Mipangilio imehifadhiwa!");
  };

  window.verifyPayment = async (id) => {
    await updateDoc(doc(db, "payments", id), { status: "verified", verifiedAt: Date.now() });
    alert("Muamala umethibitishwa! Salio limeongezeka kwa creator.");
  };

  window.markWithdrawPaid = async (id) => {
    await updateDoc(doc(db, "withdrawals", id), { status: "paid", paidAt: Date.now() });
    alert("Malipo ya creator yamerekodiwa kuwa yamekamilika!");
  };
</script>
</body>
</html>
