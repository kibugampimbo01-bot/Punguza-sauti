<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fanya Malipo - PUNGUZA SAUTI</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #0b0f19; color: #f8fafc; padding: 16px; }
    .container { max-width: 480px; margin: 0 auto; }
    .header { text-align: center; padding: 16px 0; border-bottom: 1px solid #1e293b; margin-bottom: 20px; }
    .header h1 { margin: 0; font-size: 20px; color: #38bdf8; }
    .card { background: #1e293b; border-radius: 14px; padding: 18px; margin-bottom: 16px; border: 1px solid #334155; }
    .pay-box { background: #0f172a; padding: 14px; border-radius: 10px; border: 1px dashed #38bdf8; margin: 14px 0; font-size: 14px; line-height: 1.6; }
    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 15px; margin-bottom: 14px; }
    button { width: 100%; padding: 14px; border: none; border-radius: 10px; background: #16a34a; color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>PUNGUZA SAUTI • MALIPO</h1>
  </div>

  <div id="loadingBox" class="card" style="text-align:center;">Inapakia taarifa...</div>

  <!-- FOMU YA MALIPO -->
  <div id="paymentCard" class="card hidden">
    <span style="font-size:12px; color:#94a3b8;">Unamlipia:</span>
    <h2 id="creatorLabel" style="margin:4px 0 12px; color:#4ade80;"></h2>

    <div class="pay-box" id="paymentInstructions">
      Inapakia namba za malipo...
    </div>

    <label>Kiasi Unacholipia (TSh)</label>
    <input type="number" id="payAmount" placeholder="Mfano: 2000">

    <label>Namba Yako Uliyolipia</label>
    <input type="tel" id="buyerPhone" placeholder="Mfano: 0712345678">

    <label>Kumbukumbu ya Muamala (Transaction ID / Jina la Mlipaji)</label>
    <input type="text" id="txId" placeholder="Mfano: PP261122.1234.A56789 au Juma Ally">

    <button onclick="submitPayment()">Nimeshalipa • Tuma Uthibitisho</button>
  </div>

  <!-- KUSUBIRI UHAKIKI -->
  <div id="waitingCard" class="card hidden" style="text-align:center;">
    <h2 style="color:#facc15;">Malipo Yako Yanahakikiwa...</h2>
    <p style="font-size:14px; color:#cbd5e1; line-height:1.5;">
      Taarifa za muamala wako zimetumwa. Subiri sekunde chache wakati muamala unathibitishwa.
    </p>
  </div>

  <!-- MALIPO YAMETHIBITISHWA -->
  <div id="verifiedCard" class="card hidden" style="text-align:center;">
    <h2 style="color:#4ade80;">✔ Malipo Yamethibitishwa!</h2>
    <p style="font-size:14px; color:#cbd5e1; line-height:1.5;">
      Asante! Muamala wako umepokelewa na kuthibitishwa kikamilifu kwa <b id="confirmedCreator"></b>.
    </p>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, addDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDGO1CbF7SamuFLH2JLczAlOw3uoEwURlg",
    authDomain: "bongo-pesalink.firebaseapp.com",
    projectId: "bongo-pesalink",
    storageBucket: "bongo-pesalink.firebasestorage.app",
    messagingSenderId: "987154176441",
    appId: "1:987154176441:web:b13e754ece8996ca737e68"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const params = new URLSearchParams(window.location.search);
  const creatorPhone = params.get("c");
  let creatorName = creatorPhone;

  async function init() {
    if (!creatorPhone) {
      document.getElementById("loadingBox").innerText = "Link hii si sahihi.";
      return;
    }

    const cSnap = await getDoc(doc(db, "creators", creatorPhone));
    if (cSnap.exists() && cSnap.data().name) {
      creatorName = cSnap.data().name;
    }

    const setSnap = await getDoc(doc(db, "settings", "config"));
    let payText = "Wasiliana na msimamizi kwa namba ya malipo.";
    if (setSnap.exists() && setSnap.data().paymentDetails) {
      payText = setSnap.data().paymentDetails.replace(/\n/g, "<br>");
    }

    document.getElementById("loadingBox").classList.add("hidden");
    document.getElementById("creatorLabel").innerText = creatorName;
    document.getElementById("paymentInstructions").innerHTML = "<b>Lipia kwenda:</b><br>" + payText;
    document.getElementById("paymentCard").classList.remove("hidden");
  }

  window.submitPayment = async () => {
    const amount = Number(document.getElementById("payAmount").value);
    const buyerPhone = document.getElementById("buyerPhone").value.trim();
    const txId = document.getElementById("txId").value.trim();

    if (amount < 500) return alert("Weka kiasi sahihi ulicholipia (angalau TSh 500)!");
    if (buyerPhone.length < 9 || txId.length < 3) {
      return alert("Weka namba yako ya simu na kumbukumbu ya muamala!");
    }

    const payDoc = await addDoc(collection(db, "payments"), {
      videoTitle: "Malipo ya moja kwa moja (" + creatorName + ")",
      creatorPhone,
      amount,
      buyerPhone,
      txId,
      status: "pending",
      createdAt: Date.now()
    });

    document.getElementById("paymentCard").classList.add("hidden");
    document.getElementById("waitingCard").classList.remove("hidden");

    onSnapshot(doc(db, "payments", payDoc.id), (snap) => {
      if (snap.exists() && snap.data().status === "verified") {
        document.getElementById("waitingCard").classList.add("hidden");
        document.getElementById("confirmedCreator").innerText = creatorName;
        document.getElementById("verifiedCard").classList.remove("hidden");
      }
    });
  };

  init();
</script>
</body>
</html>
